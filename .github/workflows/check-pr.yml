# ตรวจงานใน Pull Request ก่อน merge เข้า main
# public: เช็ค syntax JavaScript และไฟล์หลักของ dashboard / แอปครู ยังอยู่ครบ
name: Check pull request

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: find public -name "*.js" -not -path "*/vendor/*" -print0 | xargs -0 -n1 node --check

      - name: Check required files exist
        run: |
          for f in public/index.html public/dashboard/index.html public/app/index.html public/shared/core.js public/shared/base.css; do
            test -f "$f" || { echo "missing $f"; exit 1; }
          done
