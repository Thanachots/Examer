# Deploy เว็บ (โฟลเดอร์ public/ = dashboard/ + app/ + shared/ + engine/) ขึ้น GitHub Pages
# ทำงานเมื่อ: มีการ push/merge เข้า main ที่แก้ไฟล์ใน public/ หรือกดรันเองในแท็บ Actions
name: Deploy public to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "public/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# ถ้ามีหลายคน merge ติดกัน ให้ deploy ทีละรอบ และยกเลิกรอบเก่าที่ยังรออยู่
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Check JavaScript syntax
        run: find public -name "*.js" -not -path "*/vendor/*" -print0 | xargs -0 -n1 node --check

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - id: deployment
        uses: actions/deploy-pages@v4
